<!doctype html><meta charset=utf-8>
<style>
 html,body{margin:0;height:100%;overflow:hidden;background:#fff}
 .r{background:#ff0000;height:33.3%}
 .g{background:#00ff00;height:33.3%}
 .b{background:#0000ff;height:33.4%}
 .box{position:absolute;top:60px;left:60px;width:120px;height:120px;background:#fff;border:10px solid #000}
 .spin{width:90px;height:90px;margin:5px;background:#000;animation:s 1s linear infinite}
 @keyframes s{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>
<div class=r></div><div class=g></div><div class=b></div>
<div class=box><div class=spin></div></div>
